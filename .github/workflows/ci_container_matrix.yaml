name: CI

on: [ push ]

jobs:
  upload:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ "el8", "el9" ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install astyle
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle

      - name: Check astyle version
        run: astyle --version

      - name: Run astyle
        run: astyle --options=astyle-options.ini --mode=c --recursive "./*.c, *.h"

      - name: Get git diff
        id: diff
        run: |
          if git diff --exit-code; then
            echo "No changes to commit."
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Assert git diff
        if: steps.diff.outputs.changes == 'true'
        run: |
          echo "::error::There are changes done by astyle."
          exit 1

      - name: Check Podman version
        run: podman --version

      - name: enable podman
        run: systemctl --user start podman.socket

      - name: Build container
        run: podman build . --tag builder -f "Dockerfile.${{ matrix.os }}"

      - name: Build project
        run: podman run -v "${{ github.workspace }}:/code:Z" builder
